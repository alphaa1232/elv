                    </div>
                  </div>
                ))}
              </div>

              <form onSubmit={handleSendMessage} className="p-3 border-t border-slate-800 bg-slate-950 flex space-x-2">
                <input 
                  type="text" 
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Ask about enterprise IT solutions..."
                  className="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"
                />
                <button type="submit" className="p-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-lg">
                  <Icon name="send" className="w-4 h-4" />
                </button>
              </form>
            </div>
          )}

          {/* POLICY / TERMS / CERTIFICATIONS MODAL OVERLAY */}
          {policyModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-2xl w-full my-8 overflow-hidden shadow-2xl relative">
                
                {/* Header */}
                <div className="bg-slate-950 p-6 border-b border-slate-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="p-2.5 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-xl">
                      <Icon name={policyModal === 'privacy' ? 'shield-check' : policyModal === 'terms' ? 'file-text' : 'award'} className="w-6 h-6" />
                    </div>
                    <div>
                      <h2 className="text-xl font-bold text-white">
                        {policyModal === 'privacy' && 'Global Privacy Policy'}
                        {policyModal === 'terms' && 'Enterprise Terms of Service'}
                        {policyModal === 'security' && 'Security & Compliance Standards'}
                      </h2>
                      <p className="text-xs text-slate-400">Elvyvor Enterprise Governance Portal</p>
                    </div>
                  </div>
                  <button onClick={() => setPolicyModal(null)} className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                    <Icon name="x" className="w-6 h-6" />
                  </button>
                </div>

                {/* Body Content */}
                <div className="p-6 md:p-8 space-y-4 text-xs text-slate-300 max-h-[65vh] overflow-y-auto leading-relaxed">
                  
                  {policyModal === 'privacy' && (
                    <>
                      <div className="p-3 bg-cyan-950/60 border border-cyan-800/50 rounded-xl text-cyan-300 font-semibold">
                        Effective Date: January 1, 2026 | Last Updated: Q1 2026
                      </div>
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 pt-2">1. Data Collection & Usage</h3>
                      <p>Elvyvor adheres strictly to international data privacy regulations including GDPR, CCPA, and India Digital Personal Data Protection (DPDP) standards. We process client information solely for advisory engagement execution and technical system configuration.</p>
                      
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 pt-2">2. Information Governance & Security</h3>
                      <p>All communication channels and advisory metrics are encrypted in transit via TLS 1.3 and at rest via AES-256 standards. We do not sell, rent, or monetize client technical telemetry under any circumstances.</p>

                      <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 pt-2">3. Zero-Trust Telemetry</h3>
                      <p>Our automated diagnostics and cloud telemetry features collect non-identifiable system performance metrics strictly designed to optimize cluster performance and mitigate cybersecurity vulnerabilities.</p>
                    </>
                  )}

                  {policyModal === 'terms' && (
                    <>
                      <div className="p-3 bg-cyan-950/60 border border-cyan-800/50 rounded-xl text-cyan-300 font-semibold">
                        Global Master Services Agreement | Enterprise Advisory Framework
                      </div>
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 pt-2">1. Scope of Advisory Services</h3>
                      <p>Elvyvor provides enterprise technology consulting, multi-cloud architecture engineering, application modernization, and zero-trust cybersecurity governance as defined under signed Statements of Work (SOW).</p>
                      
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 pt-2">2. Intellectual Property Rights</h3>
                      <p>All custom software code, data pipelines, and architecture configurations created specifically for clients remain the exclusive property of the client upon fulfillment of engagement milestones.</p>

                      <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 pt-2">3. Service Level Guarantees</h3>
                      <p>Advisory and managed infrastructure systems carry guaranteed operational SLAs up to 99.99% availability backed by round-the-clock Security Operations Center (SOC) oversight.</p>
                    </>
                  )}

                  {policyModal === 'security' && (
                    <>
                      <div className="p-3 bg-cyan-950/60 border border-cyan-800/50 rounded-xl text-cyan-300 font-semibold">
                        Certified Compliance Posture & International Standards
                      </div>
                      
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <p className="font-bold text-white text-sm">ISO 27001:2022</p>
                          <p className="text-slate-400 text-[11px] mt-1">Certified Information Security Management System (ISMS) across all advisory facilities.</p>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <p className="font-bold text-white text-sm">SOC 2 Type II</p>
                          <p className="text-slate-400 text-[11px] mt-1">Annual third-party audit verifying security, availability, and processing integrity controls.</p>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <p className="font-bold text-white text-sm">PCI-DSS v4.0</p>
                          <p className="text-slate-400 text-[11px] mt-1">Level 1 certified compliance for financial transaction pipelines & microservices architecture.</p>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <p className="font-bold text-white text-sm">HIPAA & GDPR</p>
                          <p className="text-slate-400 text-[11px] mt-1">End-to-end encrypted medical data lakehouse governance with audit tracking.</p>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-[11px] text-slate-400 mt-4">
                        <p className="text-white font-semibold mb-1">Automated Vulnerability Monitoring:</p>
                        <p>Continuous automated penetration testing and eBPF kernel-level runtime security checks executed 24/7 across all client clusters.</p>
                      </div>
                    </>
                  )}

                </div>

                {/* Modal Footer */}
                <div className="bg-slate-950 p-4 border-t border-slate-800 flex justify-end">
                  <button 
                    onClick={() => setPolicyModal(null)}
                    className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold border border-slate-700"
                  >
                    Close Document
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* INTERACTIVE DOMAIN CASE STUDY DOCUMENT READER MODAL */}
          {selectedCaseStudy && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-3xl w-full my-8 overflow-hidden shadow-2xl relative">
                <div className="bg-slate-950 p-6 border-b border-slate-800 flex justify-between items-start">
                  <div>
                    <span className="text-xs font-mono uppercase text-cyan-400 bg-cyan-950 px-2.5 py-1 rounded border border-cyan-800">
                      {selectedCaseStudy.industry}
                    </span>
                    <h2 className="text-2xl font-black text-white mt-2">{selectedCaseStudy.title}</h2>
                    <p className="text-slate-400 text-xs mt-1">{selectedCaseStudy.subtitle}</p>
                  </div>
                  <button 
                    onClick={() => setSelectedCaseStudy(null)} 
                    className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800"
                  >
                    <Icon name="x" className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 md:p-8 space-y-6 text-xs text-slate-300 max-h-[70vh] overflow-y-auto">
                  <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 space-y-2">
                    <p className="text-slate-400"><strong className="text-slate-200">Client Profile:</strong> {selectedCaseStudy.client}</p>
                    <p className="text-slate-300 leading-relaxed"><strong className="text-cyan-400">Executive Summary:</strong> {selectedCaseStudy.execSummary}</p>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 mb-2">Operational Challenge</h3>
                    <p className="bg-slate-950 p-4 rounded-xl border border-slate-800 leading-relaxed text-slate-300">{selectedCaseStudy.challenge}</p>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 mb-2">Solution Architecture & Strategy</h3>
                    <ul className="space-y-2 bg-slate-950 p-4 rounded-xl border border-slate-800">
                      {selectedCaseStudy.architecture.map((arch, i) => (
                        <li key={i} className="flex items-start">
                          <Icon name="check-circle-2" className="w-4 h-4 text-cyan-400 mr-2 flex-shrink-0 mt-0.5" />
                          <span>{arch}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 mb-2">Verified Impact Metrics</h3>
                    <div className="grid grid-cols-3 gap-4">
                      {selectedCaseStudy.impact.map((imp, i) => (
                        <div key={i} className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                          <p className="text-2xl font-black text-cyan-400">{imp.value}</p>
                          <p className="text-[11px] text-slate-400 mt-1">{imp.label}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-white uppercase tracking-wider text-cyan-400 mb-2">Technologies Deployed</h3>
                    <div className="flex flex-wrap gap-2">
                      {selectedCaseStudy.techStack.map((tech, i) => (
                        <span key={i} className="px-3 py-1 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg font-mono text-[11px]">
                          {tech}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="bg-slate-950 p-6 border-t border-slate-800 flex flex-wrap justify-between items-center gap-4">
                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold flex items-center space-x-2 border border-slate-700"
                  >
                    <Icon name="printer" className="w-4 h-4 text-cyan-400" />
                    <span>Print Blueprint</span>
                  </button>

                  <button 
                    onClick={() => {
                      setSelectedCaseStudy(null);
                      navigateTo('contact');
                    }}
                    className="px-6 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-lg shadow-cyan-500/20"
                  >
                    Engage Practice Lead
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ROI CALCULATOR MODAL */}
          {roiModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 md:p-8 max-w-lg w-full space-y-6 relative shadow-2xl">
                <button onClick={() => setRoiModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <Icon name="x" className="w-5 h-5" />
                </button>
                
                <div className="flex items-center space-x-3">
                  <Icon name="calculator" className="w-6 h-6 text-cyan-400" />
                  <h2 className="text-2xl font-bold text-white">Enterprise ROI Calculator</h2>
                </div>

                <form onSubmit={calculateROI} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-2">Number of System Users / Workforce</label>
                    <input 
                      type="number" 
                      value={roiInputs.employees} 
                      onChange={(e) => setRoiInputs({...roiInputs, employees: Number(e.target.value)})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" 
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-2">Annual Legacy Operating Budget ($)</label>
                    <input 
                      type="number" 
                      value={roiInputs.legacyCost} 
                      onChange={(e) => setRoiInputs({...roiInputs, legacyCost: Number(e.target.value)})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" 
                    />
                  </div>

                  <button type="submit" className="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl uppercase tracking-wider text-xs shadow-lg shadow-cyan-500/20">
                    Calculate ROI Multiplier
                  </button>
                </form>

                {roiResult && (
                  <div className="p-4 bg-slate-950 border border-cyan-500/30 rounded-xl space-y-2 text-xs">
                    <p className="text-cyan-400 font-bold uppercase">Estimated Annual Impact:</p>
                    <div className="grid grid-cols-2 gap-2 text-slate-200">
                      <div>Legacy Cost Reduction: <span className="font-bold text-white">${roiResult.annualSavings.toLocaleString()}</span></div>
                      <div>Productivity Multiplier: <span className="font-bold text-white">${roiResult.productivityGain.toLocaleString()}</span></div>
                    </div>
                    <p className="text-green-400 font-bold pt-1">Estimated Net ROI: {roiResult.netROI}% over 3 Years</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TECHNICAL ARCHITECTURE SPEC MODAL */}
          {archModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 md:p-8 max-w-2xl w-full space-y-6 relative shadow-2xl">
                <button onClick={() => setArchModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-3">
                  <Icon name="layers" className="w-6 h-6 text-cyan-400" />
                  <h2 className="text-2xl font-bold text-white">Elvyvor Architecture Blueprint Specs</h2>
                </div>

                <div className="space-y-4 text-xs text-slate-300">
                  <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                    <p className="font-bold text-white">1. Multi-Region Edge Mesh Layer</p>
                    <p className="text-slate-400">Global Anycast Routing, WAF Layer 7 DDoS mitigation, TLS 1.3 encryption.</p>
                  </div>
                  <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                    <p className="font-bold text-white">2. Microservices Application Core</p>
                    <p className="text-slate-400">Kubernetes EKS auto-scaling clusters, gRPC transport, Istio service mesh security.</p>
                  </div>
                  <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                    <p className="font-bold text-white">3. Data & Private AI Pipeline</p>
                    <p className="text-slate-400">Apache Kafka event sourcing, Snowflake Data Warehouse, isolated GPU LLM inference nodes.</p>
                  </div>
                </div>

                <div className="flex justify-end">
                  <button 
                    onClick={() => setArchModalOpen(false)}
                    className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold"
                  >
                    Close Specification
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* REGION SELECTOR MODAL */}
          {regionModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4 relative shadow-2xl">
                <button onClick={() => setRegionModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <h2 className="text-xl font-bold text-white">Select Regional Operating Center</h2>

                <div className="space-y-2 text-xs">
                  {[
                    "Asia Pacific (India - HQ)",
                    "North America (East - USA)",
                    "Europe (EMEA - UK & Germany)",
                    "Latin America & Caribbean"
                  ].map((reg, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        setSelectedRegion(reg);
                        setRegionModalOpen(false);
                      }}
                      className={`w-full p-3 rounded-xl text-left border transition-all ${
                        selectedRegion === reg 
                          ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300 font-bold' 
                          : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800'
                      }`}
                    >
                      {reg}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* SEARCH OVERLAY */}
          {searchOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-start justify-center pt-24 px-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-2xl w-full space-y-4 relative shadow-2xl">
                <button onClick={() => setSearchOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="relative">
                  <Icon name="search" className="w-5 h-5 text-slate-400 absolute left-4 top-3.5" />
                  <input 
                    type="text" 
                    autoFocus
                    placeholder="Search services, case studies, whitepapers, or solutions..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-12 pr-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500"
                  />
                </div>

                <div className="text-xs text-slate-400">
                  <p className="font-semibold text-slate-300 mb-2">Quick Search Shortcuts:</p>
                  <div className="flex flex-wrap gap-2">
                    {['Banking Case Study', 'Healthcare Case Study', 'Cloud Migration', 'ROI Tool', 'Careers', 'Contact'].map((tag, i) => (
                      <button 
                        key={i}
                        onClick={() => {
                          setSearchQuery(tag);
                        }}
                        className="px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg hover:text-cyan-400 hover:border-cyan-500"
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
