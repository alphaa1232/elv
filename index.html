                  <li><button onClick={() => navigateTo('careers')} className="hover:text-cyan-400">Careers</button></li>

          >

          {/* AI CHATBOT DRAWER */}

                <button onClick={() => setChatbotOpen(false)} className="text-slate-400 hover:text-white">
                  <Icon name="x" className="w-5 h-5" />

              </div>

                </button>

                <div className="relative">
                  <Icon name="search" className="w-5 h-5 text-slate-400 absolute left-4 top-3.5" />

                    type="text"

                      <button 
                        key={i}
                        onClick={() => {
                          setSearchQuery(tag);
                        }}
                        className="px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg hover:text-cyan-400 hover:border-cyan-500"
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
